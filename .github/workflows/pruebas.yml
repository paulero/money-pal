name: Pruebas

on:
  push:
  pull_request:

# Solo lectura: las pruebas no publican nada ni necesitan escribir en el repositorio
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por commit (no por etiqueta, que se puede mover). Dependabot propone las nuevas.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Contribuciones externas solo en banks/ y docs/
        # Los comandos y scripts corren con acceso al Gmail de cada persona: un cambio ahí desde un fork
        # lo revisa el mantenedor a mano (y lo acepta como administrador), nunca pasa solo con las pruebas.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          sensibles=$(git diff --name-only "$BASE" HEAD | grep -Ev '^(banks/[a-z0-9-]+/|banks/README\.md$|docs/)' || true)
          if [ -n "$sensibles" ]; then
            echo "::error::Este Pull Request cambia archivos que solo el mantenedor puede aceptar:"
            echo "$sensibles"
            exit 1
          fi

      - name: Nada de datos reales en el repositorio
        run: |
          if git ls-files | grep -E '^(data|output)/|\.(xlsx|xls|csv|pdf)$'; then
            echo "::error::Estos archivos no deben subirse (datos personales o reportes)."
            exit 1
          fi
          if grep -rlE '"(toRecipients|ccRecipients|viewUrl|historyId)"' banks/*/pruebas/ 2>/dev/null; then
            echo "::error::Las pruebas de bancos no deben incluir destinatarios, enlaces ni historyId."
            exit 1
          fi

      - name: Bancos (banco.json y pruebas con correos ficticios)
        run: python scripts/probar_bancos.py

      - name: DMARC de los remitentes (comparado con el DNS real)
        run: python scripts/dmarc.py --verificar

      - name: Gmail en solo lectura (lista de permitidos)
        run: |
          jq -e '.hooks.PreToolUse[] | select(.matcher == "mcp__claude_ai_Gmail__.*") | .hooks[].command | contains("gmail_solo_lectura.py")' .claude/settings.json
          for t in search_threads get_message get_thread; do
            echo "{\"tool_name\":\"mcp__claude_ai_Gmail__$t\"}" | python scripts/gmail_solo_lectura.py
          done
          for t in send_message trash_message label_thread una_herramienta_nueva; do
            if echo "{\"tool_name\":\"mcp__claude_ai_Gmail__$t\"}" | python scripts/gmail_solo_lectura.py 2>/dev/null; then
              echo "::error::$t debería estar bloqueada"; exit 1
            fi
          done

      - name: Scripts de shell
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Reporte de ejemplo (Excel, PDF y cierre de mes)
        run: |
          pip install -q --require-hashes -r requirements.txt
          python scripts/comparar.py --ejemplo
          python scripts/exportar.py --ejemplo --cierre --salida /tmp/salida
          ls -la /tmp/salida
